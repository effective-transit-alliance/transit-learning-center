<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="white"/>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">
    Transit Fare Structures: Prepaid Unlimited vs. Fare Capping
  </text>

  <!--
    Coordinate system:
    Plot area: (100, 50) to (850, 490)
    X: 0–70 trips    tx(t) = 100 + t * 10.714
    Y: $0–$210       ty(c) = 490 - c * 2.095

    Per-trip fare: $3/trip
    Unlimited pass:  $90  (break-even at 30 trips)
    Fare cap:       $150  (cap reached at 50 trips)

    Key pixel coordinates:
      tx(0)=100  tx(30)=421  tx(50)=636  tx(70)=850
      ty(0)=490  ty(90)=301  ty(150)=176  ty(210)=50
  -->

  <!-- Horizontal grid lines -->
  <g stroke="#e8e8e8" stroke-width="0.7">
    <line x1="100" y1="427" x2="850" y2="427"/>  <!-- $30 -->
    <line x1="100" y1="364" x2="850" y2="364"/>  <!-- $60 -->
    <line x1="100" y1="301" x2="850" y2="301"/>  <!-- $90 -->
    <line x1="100" y1="239" x2="850" y2="239"/>  <!-- $120 -->
    <line x1="100" y1="176" x2="850" y2="176"/>  <!-- $150 -->
    <line x1="100" y1="113" x2="850" y2="113"/>  <!-- $180 -->
    <line x1="100" y1="50"  x2="850" y2="50"/>   <!-- $210 -->
  </g>

  <!-- ============ SURPLUS REGIONS (behind lines) ============ -->

  <!-- Agency surplus: pass holders who ride fewer than 30 trips pay $90 but
       would have spent less per-trip — the difference is agency revenue surplus -->
  <polygon points="100,301 421,301 100,490"
           fill="#e67e22" fill-opacity="0.18" stroke="none"/>

  <!-- Rider surplus: Unlimited pass (green triangle) -->
  <!-- From break-even (trip 30, $90) along per-trip line to (trip 70, $210), back at $90 -->
  <polygon points="421,301 850,50 850,301"
           fill="#0d9668" fill-opacity="0.18" stroke="none"/>

  <!-- Rider surplus: Fare cap (blue triangle) -->
  <!-- From cap point (trip 50, $150) along per-trip line to (trip 70, $210), back at $150 -->
  <polygon points="636,176 850,50 850,176"
           fill="#2563eb" fill-opacity="0.22" stroke="none"/>

  <!-- ============ LINES ============ -->

  <!-- Pay-per-ride reference line ($3/trip diagonal) -->
  <line x1="100" y1="490" x2="850" y2="50"
        stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7,5"/>

  <!-- Unlimited pass line (horizontal at $90) -->
  <line x1="100" y1="301" x2="850" y2="301"
        stroke="#0d9668" stroke-width="2.5"/>

  <!-- Fare cap line (follows per-trip, then horizontal at $150) -->
  <polyline points="100,490 636,176 850,176"
            fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- ============ KEY POINTS ============ -->

  <!-- Break-even dot (unlimited) -->
  <circle cx="421" cy="301" r="4.5" fill="#0d9668" stroke="white" stroke-width="1.5"/>

  <!-- Cap-reached dot (fare cap) -->
  <circle cx="636" cy="176" r="4.5" fill="#2563eb" stroke="white" stroke-width="1.5"/>

  <!-- Vertical dashed guides at break-even and cap points -->
  <line x1="421" y1="301" x2="421" y2="490"
        stroke="#0d9668" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="636" y1="176" x2="636" y2="490"
        stroke="#2563eb" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- ============ AXES ============ -->

  <line x1="100" y1="490" x2="860" y2="490" stroke="#333" stroke-width="1.8"/>
  <line x1="100" y1="490" x2="100" y2="42"  stroke="#333" stroke-width="1.8"/>

  <!-- X-axis arrow -->
  <polygon points="858,486 858,494 868,490" fill="#333"/>
  <!-- Y-axis arrow -->
  <polygon points="96,44 104,44 100,34" fill="#333"/>

  <!-- X-axis ticks and labels -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <line x1="100" y1="490" x2="100" y2="497" stroke="#555" stroke-width="1"/>
    <text x="100" y="510">0</text>

    <line x1="207" y1="490" x2="207" y2="497" stroke="#555" stroke-width="1"/>
    <text x="207" y="510">10</text>

    <line x1="314" y1="490" x2="314" y2="497" stroke="#555" stroke-width="1"/>
    <text x="314" y="510">20</text>

    <line x1="421" y1="490" x2="421" y2="497" stroke="#555" stroke-width="1"/>
    <text x="421" y="510">30</text>

    <line x1="529" y1="490" x2="529" y2="497" stroke="#555" stroke-width="1"/>
    <text x="529" y="510">40</text>

    <line x1="636" y1="490" x2="636" y2="497" stroke="#555" stroke-width="1"/>
    <text x="636" y="510">50</text>

    <line x1="743" y1="490" x2="743" y2="497" stroke="#555" stroke-width="1"/>
    <text x="743" y="510">60</text>

    <line x1="850" y1="490" x2="850" y2="497" stroke="#555" stroke-width="1"/>
    <text x="850" y="510">70</text>
  </g>

  <!-- X-axis label -->
  <text x="475" y="540" text-anchor="middle" font-size="14" fill="#333">
    Trips per Month
  </text>

  <!-- Y-axis ticks and labels -->
  <g font-size="12" fill="#555" text-anchor="end">
    <line x1="93" y1="490" x2="100" y2="490" stroke="#555" stroke-width="1"/>
    <text x="88" y="494">$0</text>

    <line x1="93" y1="427" x2="100" y2="427" stroke="#555" stroke-width="1"/>
    <text x="88" y="431">$30</text>

    <line x1="93" y1="364" x2="100" y2="364" stroke="#555" stroke-width="1"/>
    <text x="88" y="368">$60</text>

    <line x1="93" y1="301" x2="100" y2="301" stroke="#555" stroke-width="1"/>
    <text x="88" y="305">$90</text>

    <line x1="93" y1="239" x2="100" y2="239" stroke="#555" stroke-width="1"/>
    <text x="88" y="243">$120</text>

    <line x1="93" y1="176" x2="100" y2="176" stroke="#555" stroke-width="1"/>
    <text x="88" y="180">$150</text>

    <line x1="93" y1="113" x2="100" y2="113" stroke="#555" stroke-width="1"/>
    <text x="88" y="117">$180</text>

    <line x1="93" y1="50" x2="100" y2="50" stroke="#555" stroke-width="1"/>
    <text x="88" y="54">$210</text>
  </g>

  <!-- Y-axis label -->
  <text x="0" y="0" font-size="14" fill="#333"
        transform="translate(38,310) rotate(-90)">
    Total Cost
  </text>

  <!-- ============ SURPLUS REGION LABELS ============ -->

  <!-- Agency surplus label (inside the orange triangle, left of break-even) -->
  <text x="210" y="375" text-anchor="middle"
        font-size="12" font-weight="600" fill="#b35c13">
    Agency surplus
  </text>

  <!-- Green surplus label (in the green-only trapezoid between $90 and $120 lines) -->
  <text x="700" y="275" text-anchor="middle"
        font-size="12" font-weight="600" fill="#0a7c55">
    Rider surplus
  </text>
  <text x="700" y="291" text-anchor="middle"
        font-size="11" fill="#0a7c55">
    (unlimited pass)
  </text>

  <!-- Blue surplus label (inside the blue triangle) -->
  <text x="790" y="130" text-anchor="middle"
        font-size="12" font-weight="600" fill="#1d4ed8">
    Rider surplus
  </text>
  <text x="790" y="146" text-anchor="middle"
        font-size="11" fill="#1d4ed8">
    (fare cap)
  </text>

  <!-- ============ BREAK-EVEN ANNOTATIONS ============ -->

  <!-- Unlimited break-even label -->
  <text x="395" y="292" text-anchor="end"
        font-size="10.5" fill="#0a7c55" font-style="italic">
    Break-even
  </text>
  <text x="395" y="304" text-anchor="end"
        font-size="10.5" fill="#0a7c55" font-style="italic">
    (30 trips)
  </text>

  <!-- Fare cap reached label -->
  <text x="662" y="166" text-anchor="start"
        font-size="10.5" fill="#1d4ed8" font-style="italic">
    Cap reached
  </text>
  <text x="662" y="178" text-anchor="start"
        font-size="10.5" fill="#1d4ed8" font-style="italic">
    (50 trips)
  </text>

  <!-- ============ PRICE LABELS ON RIGHT EDGE ============ -->

  <text x="858" y="297" font-size="11" fill="#0d9668" font-weight="600">$90</text>
  <text x="858" y="172" font-size="11" fill="#2563eb" font-weight="600">$150</text>
  <text x="858" y="60" font-size="11" fill="#94a3b8">$210</text>

  <!-- ============ LEGEND ============ -->

  <g transform="translate(115,555)">
    <rect x="-8" y="-16" width="680" height="42" rx="6"
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Pay-per-ride -->
    <line x1="5" y1="5" x2="32" y2="5"
          stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7,5"/>
    <text x="40" y="9" font-size="12" fill="#555">Pay-per-ride ($3/trip)</text>

    <!-- Unlimited pass -->
    <line x1="225" y1="5" x2="252" y2="5"
          stroke="#0d9668" stroke-width="2.5"/>
    <text x="260" y="9" font-size="12" fill="#555">Unlimited pass ($90/mo)</text>

    <!-- Fare cap -->
    <line x1="455" y1="5" x2="482" y2="5"
          stroke="#2563eb" stroke-width="2.5"/>
    <text x="490" y="9" font-size="12" fill="#555">Fare cap ($150/mo)</text>
  </g>

</svg>
